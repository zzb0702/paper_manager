<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Manager · 论文库</title>
<script src="static/echarts.min.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #161d24; --line: #232d38; --text: #d8e0e8;
    --dim: #7b8a99; --accent: #4f9cf9; --amber: #f5a623; --ok: #58c98b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin-right: 6px; white-space: nowrap; }
  #stats { color: var(--dim); font-size: 12px; margin-right: auto; }
  button, select, input { font-size: 13px; }
  button, select { background: #1d2731; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  input { background: #0b1015; border: 1px solid var(--line); color: var(--text); padding: 7px 10px; border-radius: 8px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  main { flex: 1; display: grid; grid-template-columns: 270px 1fr 370px; min-height: 0; }
  .side { background: var(--panel); overflow-y: auto; padding: 12px; }
  .side.left { border-right: 1px solid var(--line); }
  .side.right { border-left: 1px solid var(--line); display: none; }
  .side.right.open { display: block; }
  .sect { margin-bottom: 16px; }
  .sect > h3 { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .sect .row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .sect .row input, .sect .row select { flex: 1; min-width: 0; }
  .sect label.mini { color: var(--dim); font-size: 12px; display: block; margin: 6px 0 3px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 14px; padding: 3px 10px; margin: 0 6px 6px 0; cursor: pointer; font-size: 12px; }
  .chip.active { border-color: var(--accent); background: #1d2731; }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  #stage { position: relative; min-width: 0; }
  #chart { width: 100%; height: 100%; }
  #viewToggle { position: absolute; top: 10px; left: 10px; z-index: 5; display: flex; gap: 0; border-radius: 8px; overflow: hidden; }
  #viewToggle button { border-radius: 0; border: none; background: var(--panel); color: var(--dim); padding: 7px 14px; }
  #viewToggle button.on { background: #1d2731; color: var(--text); }
  #hint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--dim); flex-direction: column; gap: 10px; z-index: 4; }
  #results { margin-top: 8px; }
  .card { background: #0b1015; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card b { display: block; font-size: 12px; }
  .card small { color: var(--dim); }
  aside.right h2 { font-size: 15px; margin: 2px 0 6px; }
  aside.right .meta { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .badge { font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--dim); margin-right: 4px; white-space: nowrap; }
  .summary { background: #0b1015; border: 1px solid var(--line); border-radius: 8px; padding: 9px; margin: 8px 0; }
  .abstract { color: var(--dim); font-size: 12px; max-height: 150px; overflow-y: auto; white-space: pre-wrap; }
  .abstract.open { max-height: none; }
  aside.right h4 { font-size: 12px; color: var(--accent); margin: 12px 0 4px; }
  .rel { padding: 5px 7px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .rel:hover { background: #1d2731; }
  .rel small { color: var(--dim); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  #toasts { position: fixed; bottom: 14px; right: 14px; z-index: 60; }
  .toast { background: #1d2731; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 9px 13px; margin-top: 8px; max-width: 420px; }
  .toast.err { border-left-color: #e4574f; }
  .toast.ok { border-left-color: var(--ok); }
  #spin { position: fixed; top: 10px; right: 14px; color: var(--dim); display: none; z-index: 60; }
  #modal { position: fixed; inset: 0; background: rgba(5,8,12,.75); display: none; z-index: 50; }
  #modal.open { display: flex; align-items: center; justify-content: center; }
  #modalBox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(860px, 92vw); height: 86vh; display: flex; flex-direction: column; }
  #modalBox .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #modalBody { overflow: auto; padding: 18px 22px; font-size: 13px; }
  #modalBody h1, #modalBody h2, #modalBody h3 { margin: 14px 0 6px; }
  #modalBody p { margin: 6px 0; }
  #modalBody pre { background: #0b1015; padding: 8px; border-radius: 6px; overflow-x: auto; }
  #modalBody code { background: #0b1015; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>📚 论文库</h1>
  <span id="stats"></span>
  <span style="flex:1"></span>
  <select id="engine">
    <option value="datalab">datalab（高保真，按页计费）</option>
    <option value="local">local（免费文本抽取）</option>
  </select>
  <input type="file" id="file" accept=".pdf" multiple hidden>
  <button id="btnImport">📥 导入 PDF</button>
  <button id="btnReload" title="重新加载">↻</button>
</header>
<main>
  <div class="side left">
    <div class="sect">
      <h3>检索</h3>
      <div class="row"><input id="q" placeholder="语义/关键词检索…"><button id="btnSearch">搜</button></div>
      <div id="results"></div>
    </div>
    <div class="sect">
      <h3>筛选</h3>
      <div class="row"><input id="fYearMin" type="number" placeholder="年份≥"><input id="fYearMax" type="number" placeholder="年份≤"></div>
      <div class="row"><input id="fAuthor" placeholder="作者包含…"></div>
      <div class="row"><input id="fVenue" placeholder="期刊/会议包含…"></div>
      <div class="row"><button id="btnFilter" style="flex:1">应用筛选</button><button id="btnClearFilter">清除</button></div>
    </div>
    <div class="sect">
      <h3>外观</h3>
      <label class="mini">节点大小</label>
      <div class="row"><select id="sizeMode" style="flex:1">
        <option value="cited">被引数</option>
        <option value="chunks">章节块数</option>
        <option value="uniform">统一大小</option>
      </select></div>
      <label class="mini"><input type="checkbox" id="eCite" checked> 引文边（实线箭头）</label>
      <label class="mini"><input type="checkbox" id="eSim" checked> 相似边（虚线）</label>
      <label class="mini">相似边阈值：<span id="simVal">0.55</span></label>
      <input type="range" id="sim" min="40" max="80" value="55" style="width:100%">
    </div>
    <div class="sect">
      <h3>聚类</h3>
      <div id="clusters"></div>
    </div>
  </div>

  <div id="stage">
    <div id="viewToggle">
      <button id="btnTimeline" class="on">时间轴</button>
      <button id="btnForce">关系图</button>
      <button id="btnKg">概念图</button>
    </div>
    <div id="spin">加载中…</div>
    <div id="hint">
      <div style="font-size:40px">📚</div>
      <div>论文库为空 — 点右上角「📥 导入 PDF」开始</div>
    </div>
    <div id="chart"></div>
  </div>

  <aside class="side right" id="panel"><div id="panelBody"></div></aside>
</main>
<div id="modal"><div id="modalBox">
  <div class="bar"><b id="modalTitle"></b><button id="modalClose">✕</button></div>
  <div id="modalBody"></div>
</div></div>
<div id="toasts"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PALETTE = ["#4f9cf9","#f5a623","#7dd87d","#e46fb2","#b07df9","#5fd4d0","#f9e04f","#f97b5f","#9aa7b5","#6bd66b",
                 "#c98bf5","#5fbef9","#f97b9c","#8bf97b","#f9d06b","#6b8ef9"];
let DATA = { nodes: [], edges: [] };
let byId = {}, adj = {};
let viewMode = "timeline";          // timeline | force
let filters = null;                 // {yearMin, yearMax, author, venue} applied
let isolateCluster = null;
let selectedId = null;
let chart = null;
let loading = 0;

function toast(msg, cls = "") {
  const d = document.createElement("div");
  d.className = "toast " + cls; d.textContent = msg;
  $("toasts").appendChild(d); setTimeout(() => d.remove(), 6000);
}
function spin(on) { $("spin").style.display = on ? "block" : "none"; }
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}
function esc(s) {
  return (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

// ---------------- data & derived ----------------
async function load() {
  spin(true);
  try {
    const sim = ($("sim").value / 100).toFixed(2);
    DATA = await api("/api/graph?sim=" + sim);
    byId = {}; adj = {};
    DATA.nodes.forEach(n => { byId[n.id] = n; adj[n.id] = []; });
    DATA.edges.forEach(e => {
      if (byId[e.src] && byId[e.dst]) { adj[e.src].push(e); adj[e.dst].push(e); }
    });
    renderClusters();
    if (viewMode === "kg") { renderKg(); }
    else {
      $("hint").style.display = DATA.nodes.length ? "none" : "flex";
      applyChart(true);
    }
    refreshStats();
  } catch (e) { toast("加载失败: " + e.message, "err"); }
  spin(false);
}
function refreshStats() {
  api("/api/status").then(s => {
    $("stats").textContent = `${s.papers} 篇 · ${s.chunks} 块 · ${s.vectors} 向量`;
  }).catch(() => {});
}

function matchFilters(n) {
  if (!filters) return true;
  if (filters.yearMin != null && (n.year || 0) < filters.yearMin) return false;
  if (filters.yearMax != null && (n.year || 9999) > filters.yearMax) return false;
  if (filters.author && !(n.authors || "").toLowerCase().includes(filters.author)) return false;
  if (filters.venue && !(n.venue || "").toLowerCase().includes(filters.venue)) return false;
  return true;
}
function nodeVisible(n) {
  if (isolateCluster != null && n.cluster !== isolateCluster) return false;
  return matchFilters(n);
}
function nodeSize(n) {
  const m = $("sizeMode").value;
  if (m === "cited") return 9 + Math.min(Math.sqrt(n.cited_by_count || 0) * 2.2, 24);
  if (m === "chunks") return 9 + Math.min(n.n_chunks || 1, 60) / 3;
  return 11;
}
function edgeVisible(e) {
  if (e.kind === "citation" && !$("eCite").checked) return false;
  if (e.kind === "similar" && !$("eSim").checked) return false;
  return nodeVisible(byId[e.src]) && nodeVisible(byId[e.dst]);
}

// ---------------- layout ----------------
function computeCoords() {
  const nodes = DATA.nodes;
  const years = nodes.map(n => n.year || 2024);
  let minY = Math.min(...years), maxY = Math.max(...years);
  if (maxY - minY < 2) { minY -= 1; maxY += 1; }
  const span = Math.max(maxY - minY, 1);
  const step = 240 / span;                       // 年份 → 横向步长
  // 泳道：引文连通分量，按最早年份排序
  const parent = {};
  nodes.forEach(n => parent[n.id] = n.id);
  const find = x => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  DATA.edges.filter(e => e.kind === "citation").forEach(e => {
    if (parent[e.src] != null && parent[e.dst] != null) {
      const a = find(e.src), b = find(e.dst);
      if (a !== b) parent[a] = b;
    }
  });
  const comps = {};
  nodes.forEach(n => { (comps[find(n.id)] = comps[find(n.id)] || []).push(n); });
  const ordered = Object.values(comps).sort((a, b) =>
    Math.min(...a.map(n => n.year || 2024)) - Math.min(...b.map(n => n.year || 2024)));
  const groupCount = {};
  nodes.forEach(n => {
    const lane = ordered.findIndex(c => c.includes(n));
    n._lane = lane;
  });
  const xy = {};
  ordered.forEach((comp, lane) => {
    comp.sort((a, b) => (a.year || 2024) - (b.year || 2024) || a.id - b.id);
    comp.forEach((n, k) => {
      const year = n.year || 2024;
      const key = lane + ":" + year;
      const i = groupCount[key] = (groupCount[key] || 0);
      groupCount[key]++;
      xy[n.id] = {
        x: (year - minY) * step + i * 26,
        y: -lane * 110 - k * 16,
      };
    });
  });
  return xy;
}

// ---------------- chart ----------------
function buildCategories() {
  const counts = {};
  DATA.nodes.forEach(n => counts[n.cluster] = (counts[n.cluster] || 0) + 1);
  return Object.keys(counts).sort((a, b) => a - b).map(c => ({
    name: `簇 ${+c + 1} · ${counts[c]} 篇`,
    itemStyle: { color: PALETTE[c % PALETTE.length] },
  }));
}

function applyChart(reset) {
  if (!chart) chart = echarts.init($("chart"));
  const xy = viewMode === "timeline" ? computeCoords() : null;
  const categories = buildCategories();

  const nodes = DATA.nodes.map(n => {
    const vis = nodeVisible(n);
    const d = {
      id: String(n.id),
      name: n.title.length > 36 ? n.title.slice(0, 35) + "…" : n.title,
      category: n.cluster,
      symbolSize: nodeSize(n),
      paper: n,
      itemStyle: { opacity: vis ? 1 : 0.08 },
      label: { show: vis },
    };
    if (viewMode === "timeline" && xy[n.id]) { d.x = xy[n.id].x; d.y = xy[n.id].y; }
    return d;
  });
  const links = DATA.edges.filter(edgeVisible).map(e => {
    const sim = e.kind === "similar";
    return {
      source: String(e.src), target: String(e.dst),
      kind: e.kind, weight: e.weight || 0,
      lineStyle: {
        color: sim ? "#4a5866" : "#f5a623",
        width: sim ? 1 + (e.weight - 0.55) * 8 : 1.6,
        type: sim ? "dashed" : "solid",
        opacity: 0.6,
        curveness: 0.12,
      },
      symbol: sim ? ["none", "none"] : ["none", "arrow"],
      symbolSize: 7,
    };
  });

  const series = {
    type: "graph",
    layout: viewMode === "force" ? "force" : "none",
    roam: true,
    data: nodes,
    links,
    categories,
    label: { show: true, position: "bottom", fontSize: 11, color: "#aeb9c4" },
    labelLayout: { hideOverlap: true },
    emphasis: { focus: "adjacency", lineStyle: { width: 3 } },
    blur: { itemStyle: { opacity: 0.1 }, lineStyle: { opacity: 0.04 } },
    selectedMode: "single",
    select: { itemStyle: { borderColor: "#fff", borderWidth: 2, shadowBlur: 14, shadowColor: "rgba(79,156,249,.8)" } },
    force: { repulsion: 420, edgeLength: [60, 160], gravity: 0.12 },
  };
  const option = {
    backgroundColor: "transparent",
    tooltip: {
      trigger: "item",
      formatter: (p) => {
        if (p.dataType === "node") {
          const n = byId[+p.data.id] || p.data.paper;
          if (!n) return "";
          return `<b>${esc(n.title)}</b><br><span style="color:#7b8a99">${esc(n.authors || "佚名")} · ${n.year || "?"}` +
                 ` · 被引 ${n.cited_by_count || 0} · ${n.n_chunks} 块</span>` +
                 (n.summary ? `<br>${esc(n.summary.slice(0, 150))}…` : "");
        }
        if (p.dataType === "edge") {
          const kind = p.data.kind === "citation" ? "引文关系" : `语义相似 ${p.data.weight}`;
          return `<span style="color:#7b8a99">${kind}</span>`;
        }
        return "";
      },
    },
    series: [series],
  };
  chart.setOption(option, !!reset);   // reset=true 整体重建；合并模式保留缩放视角
  if (selectedId != null && byId[selectedId]) {
    chart.dispatchAction({ type: "select", seriesIndex: 0, dataIndex: nodes.findIndex(n => +n.id === selectedId) });
  }
}

// ---------------- clusters ----------------
function renderClusters() {
  const counts = {};
  DATA.nodes.forEach(n => counts[n.cluster] = (counts[n.cluster] || 0) + 1);
  $("clusters").innerHTML = Object.keys(counts).sort((a, b) => a - b).map(c =>
    `<span class="chip ${isolateCluster === +c ? "active" : ""}" onclick="toggleCluster(${c})">` +
    `<span class="dot" style="background:${PALETTE[c % PALETTE.length]}"></span>` +
    `簇 ${+c + 1} · ${counts[c]}</span>`).join("") ||
    '<span style="color:#7b8a99">暂无</span>';
}
function toggleCluster(c) {
  isolateCluster = isolateCluster === c ? null : c;
  renderClusters(); applyChart();
}
window.toggleCluster = toggleCluster;

// ---------------- selection & panel ----------------
function selectNode(pid) {
  if (viewMode === "kg") {  // 概念图里点论文 → 先切回时间轴
    viewMode = "timeline";
    $("btnTimeline").classList.add("on");
    $("btnKg").classList.remove("on");
    applyChart(true);
  }
  selectedId = pid;
  applyChart();
  showPanel(pid);
}
window.selectNode = selectNode;

async function showPanel(pid) {
  selectedId = pid;
  history.replaceState(null, "", `?paper=${pid}`);
  const panel = $("panel"), body = $("panelBody");
  panel.classList.add("open");
  body.innerHTML = "<i style='color:#7b8a99'>加载中…</i>";
  try {
    const p = await api("/api/paper/" + pid);
    let html =
      `<button class="badge" style="float:right;cursor:pointer" onclick="closePanel()">✕ 关闭</button>` +
      `<h2>${esc(p.title)}</h2>` +
      `<div class="meta">${esc(p.authors || "佚名")} · ${p.year || "?"}` +
      (p.doi ? ` · <a style="color:#4f9cf9" href="https://doi.org/${esc(p.doi)}" target="_blank">DOI</a>` : "") +
      `<span class="badge">${p.engine}</span>` +
      (p.cited_by_count ? `<span class="badge">被引 ${p.cited_by_count}</span>` : "") +
      (p.ext_counts && p.ext_counts.refs ? `<span class="badge">参考文献 ${p.ext_counts.refs}</span>` : "") +
      `</div>` +
      `<div class="actions">` +
      `<button onclick="fetchCitations(${pid})">🔗 抓取引文</button>` +
      `<button onclick="openMarkdown(${pid})">📄 Markdown</button>` +
      `<button onclick="window.open('/api/paper/${pid}/pdf')">📕 原始 PDF</button>` +
      `</div>` +
      (p.summary ? `<div class="summary">${esc(p.summary)}</div>` : "") +
      (p.abstract ? `<div class="abstract" id="abs">${esc(p.abstract)}</div>` +
        `<span style="color:#4f9cf9;font-size:12px;cursor:pointer" onclick="document.getElementById('abs').classList.toggle('open')">展开/收起</span>` : "");
    const relSect = (label, arr, sim) => {
      if (!arr || !arr.length) return "";
      return `<h4>${label}</h4>` + arr.map(c =>
        `<div class="rel" onclick="selectNode(${c.paper_id})">` +
        `[${c.paper_id}] ${esc(c.title)}${c.year ? " (" + c.year + ")" : ""}` +
        (sim ? ` <small>相似度 ${c.similarity}</small>` : "") + `</div>`).join("");
    };
    html += relSect("引用（库内）", p.related.cites);
    html += relSect("被引（库内）", p.related.cited_by);
    html += relSect("语义相近", p.related.semantic, true);
    body.innerHTML = html;
  } catch (e) {
    body.innerHTML = `<span style="color:#e4574f">${esc(String(e))}</span>`;
  }
}
window.showPanel = showPanel;
function closePanel() {
  $("panel").classList.remove("open");
  selectedId = null;
  history.replaceState(null, "", location.pathname);
  applyChart();
}
window.closePanel = closePanel;

async function fetchCitations(pid) {
  toast("正在抓取引文（OpenAlex）…");
  try {
    const r = await api("/api/fetch-citations/" + pid, { method: "POST" });
    if (r.status === "not_found") toast("数据源暂未收录该论文，之后可重试", "err");
    else {
      toast(`已抓取：参考文献 ${r.refs}，被引 ${r.cited}` + (r.cited_by_count ? `（累计被引 ${r.cited_by_count}）` : ""), "ok");
      await load(); showPanel(pid);
    }
  } catch (e) { toast("抓取失败: " + e.message, "err"); }
}
window.fetchCitations = fetchCitations;

// ---------------- markdown viewer ----------------
function mdRender(md) {
  const lines = esc(md).split(/\r?\n/);
  let html = "", inCode = false;
  for (const line of lines) {
    if (!inCode && /^\s*<!--.*-->\s*$/.test(line)) continue;  // 页码标记不入正文
    if (line.trim().startsWith("```")) { html += inCode ? "</pre>" : "<pre>"; inCode = !inCode; continue; }
    if (inCode) { html += line + "\n"; continue; }
    let t = line
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\*([^*]+)\*/g, "<i>$1</i>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
    const h = t.match(/^(#{1,4})\s+(.*)/);
    if (h) { html += `<h${h[1].length + 1}>${h[2]}</h${h[1].length + 1}>`; continue; }
    if (/^\s*[-*]\s+/.test(t)) { html += `<p style="margin-left:14px">• ${t.replace(/^\s*[-*]\s+/, "")}</p>`; continue; }
    if (t.trim() === "") { html += "<p></p>"; continue; }
    html += `<p>${t}</p>`;
  }
  if (inCode) html += "</pre>";
  return html;
}
async function openMarkdown(pid) {
  try {
    const md = await (await fetch(`/api/paper/${pid}/markdown`)).text();
    $("modalTitle").textContent = byId[pid] ? byId[pid].title : `paper ${pid}`;
    $("modalBody").innerHTML = mdRender(md.slice(0, 200000));
    $("modal").classList.add("open");
  } catch (e) { toast("读取 Markdown 失败: " + e.message, "err"); }
}
window.openMarkdown = openMarkdown;
$("modalClose").onclick = () => $("modal").classList.remove("open");
$("modal").addEventListener("click", e => { if (e.target === $("modal")) $("modal").classList.remove("open"); });

// ---------------- search ----------------
async function doSearch() {
  const q = $("q").value.trim();
  const box = $("results");
  if (!q) { box.innerHTML = ""; return; }
  box.innerHTML = "<div class='card'><small>检索中…</small></div>";
  try {
    const { hits } = await api("/api/search?q=" + encodeURIComponent(q));
    if (!hits.length) { box.innerHTML = "<div class='card'><small>没有找到相关论文</small></div>"; return; }
    box.innerHTML = hits.map(h =>
      `<div class="card" onclick="selectNode(${h.paper_id})">` +
      `<b>[${h.paper_id}] ${esc(h.title)}</b>` +
      `<small>${h.year || "?"} · ${h.section}${h.pages ? " · p" + h.pages : ""} · ${h.matched_chunks} 处相关</small>` +
      `</div>`).join("");
  } catch (e) { box.innerHTML = `<div class="card" style="color:#e4574f">${esc(String(e))}</div>`; }
}
$("btnSearch").onclick = doSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

// ---------------- filters & appearance ----------------
$("btnFilter").onclick = () => {
  const f = {};
  if ($("fYearMin").value) f.yearMin = +$("fYearMin").value;
  if ($("fYearMax").value) f.yearMax = +$("fYearMax").value;
  if ($("fAuthor").value.trim()) f.author = $("fAuthor").value.trim().toLowerCase();
  if ($("fVenue").value.trim()) f.venue = $("fVenue").value.trim().toLowerCase();
  filters = Object.keys(f).length ? f : null;
  applyChart();
};
$("btnClearFilter").onclick = () => {
  ["fYearMin", "fYearMax", "fAuthor", "fVenue"].forEach(id => $(id).value = "");
  filters = null; applyChart();
};
$("sizeMode").onchange = () => applyChart();
$("eCite").onchange = () => applyChart();
$("eSim").onchange = () => applyChart();
$("sim").oninput = () => {
  $("simVal").textContent = ($("sim").value / 100).toFixed(2);
  clearTimeout($("sim")._t);
  $("sim")._t = setTimeout(async () => {
    await load();
  }, 500);
};

// ---------------- import ----------------
$("btnImport").onclick = () => $("file").click();
$("file").addEventListener("change", async () => {
  const files = [...$("file").files];
  const engine = $("engine").value;
  if (!files.length) return;
  $("btnImport").disabled = true;
  for (const f of files) {
    toast(`导入 ${f.name}（${engine}）…`);
    try {
      const fd = new FormData();
      fd.append("file", f); fd.append("engine", engine);
      const r = await api("/api/ingest", { method: "POST", body: fd });
      if (r.status === "duplicate") toast(`已存在: ${r.title}`, "ok");
      else if (r.status === "ok") {
        const cost = r.cost_usd != null ? `，$${r.cost_usd.toFixed(4)}` : "";
        toast(`导入成功 [${r.paper_id}] ${r.title.slice(0, 40)}（${r.chunks} 块${cost}）`, "ok");
      } else toast(JSON.stringify(r), "err");
    } catch (e) { toast(`导入失败: ${e.message}`, "err"); }
  }
  $("file").value = "";
  $("btnImport").disabled = false;
  await load();
});
$("btnReload").onclick = () => load();

// ---------------- view toggle ----------------
function setView(mode) {
  viewMode = mode;
  $("btnTimeline").classList.toggle("on", mode === "timeline");
  $("btnForce").classList.toggle("on", mode === "force");
  $("btnKg").classList.toggle("on", mode === "kg");
  if (mode === "kg") { loadKg(); return; }
  applyChart(true);
}
$("btnTimeline").onclick = () => setView("timeline");
$("btnForce").onclick = () => setView("force");
$("btnKg").onclick = () => setView("kg");

// ---------------- concept graph view (P2) ----------------
const KG_TYPES = ["method", "dataset", "task", "concept"];
const KG_COLOR = { method: "#4f9cf9", dataset: "#7dd87d", task: "#f5a623", concept: "#b07df9" };
let KG = null;

async function loadKg() {
  spin(true);
  try {
    KG = await api("/api/kg/graph");
    renderKg();
  } catch (e) { toast("概念图加载失败: " + e.message, "err"); }
  spin(false);
}

function renderKg() {
  if (!KG.nodes.length) {
    $("hint").style.display = "flex";
    $("hint").innerHTML = "<div style='font-size:40px'>🕸️</div>" +
      "<div>概念图为空 — 先运行 <b>python cli.py build-kg --all</b> 从论文中抽取实体与关系</div>";
    chart.clear();
    return;
  }
  $("hint").style.display = "none";
  const cats = KG_TYPES.map(t => ({ name: t, itemStyle: { color: KG_COLOR[t] } }));
  const nodes = KG.nodes.map(n => ({
    id: "k" + n.id,
    name: n.name.length > 30 ? n.name.slice(0, 29) + "…" : n.name,
    category: Math.max(0, KG_TYPES.indexOf(n.type)),
    symbolSize: 8 + Math.min(n.n_chunks, 30) / 2.2,
    entity: n,
  }));
  const links = KG.edges.map(e => ({
    source: "k" + e.src, target: "k" + e.dst, relation: e.relation,
    lineStyle: { color: "#4a5866", width: 1.2, opacity: 0.7, curveness: 0.1 },
  }));
  chart.setOption({
    backgroundColor: "transparent",
    legend: {
      data: KG_TYPES, top: 10, left: 10,
      textStyle: { color: "#aeb9c4", fontSize: 12 },
      icon: "circle", itemWidth: 10, itemHeight: 10,
    },
    tooltip: {
      trigger: "item",
      formatter: p => p.dataType === "node"
        ? `<b>${esc(p.data.entity.name)}</b>（${p.data.entity.type}，${p.data.entity.n_chunks} 块）` +
          (p.data.entity.desc ? `<br>${esc(p.data.entity.desc)}` : "")
        : esc(p.data.relation || "相关"),
    },
    series: [{
      type: "graph", layout: "force", roam: true,
      data: nodes, links, categories: cats,
      force: { repulsion: 260, edgeLength: [40, 120], gravity: 0.16 },
      label: { show: true, position: "right", fontSize: 11, color: "#aeb9c4" },
      labelLayout: { hideOverlap: true },
      emphasis: { focus: "adjacency", lineStyle: { width: 2.5, color: "#4f9cf9" } },
      selectedMode: "single",
      select: { itemStyle: { borderColor: "#fff", borderWidth: 2, shadowBlur: 12 } },
    }],
  }, true);
}

async function showEntityPanel(eid) {
  const panel = $("panel"), body = $("panelBody");
  panel.classList.add("open");
  body.innerHTML = "<i style='color:#7b8a99'>加载中…</i>";
  try {
    const e = await api("/api/kg/entity/" + eid);
    let html =
      `<button class="badge" style="float:right;cursor:pointer" onclick="closePanel()">✕ 关闭</button>` +
      `<h2>${esc(e.name)}</h2>` +
      `<div class="meta"><span class="badge">${esc(e.type)}</span>` +
      `</div>` +
      (e.desc ? `<div class="summary">${esc(e.desc)}</div>` : "");
    if (e.neighbors.length) {
      html += `<h4>关系（${e.neighbors.length}）</h4>` + e.neighbors.map(n =>
        `<div class="rel" onclick="showEntityPanel(${n.id})">` +
        `${n.direction === "→" ? "→" : "←"} <b>${esc(n.relation)}</b> ` +
        `${n.direction === "→" ? "" : "→"} ${esc(n.name)} ` +
        `<small>（${esc(n.type)}）</small></div>`).join("");
    }
    if (e.papers.length) {
      html += `<h4>相关论文（${e.papers.length}）</h4>` + e.papers.map(p =>
        `<div class="rel" onclick="setView('timeline'); selectNode(${p.paper_id})">` +
        `[${p.paper_id}] ${esc(p.title)}${p.year ? " (" + p.year + ")" : ""}</div>`).join("");
    }
    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = `<span style="color:#e4574f">${esc(String(err))}</span>`;
  }
}
window.showEntityPanel = showEntityPanel;

// ---------------- misc ----------------
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if ($("modal").classList.contains("open")) $("modal").classList.remove("open");
    else closePanel();
  }
});
window.addEventListener("resize", () => chart && chart.resize());

// ---------------- boot ----------------
async function boot() {
  chart = echarts.init($("chart"));
  chart.on("click", p => {
    if (viewMode === "kg" && p.dataType === "node" && p.data.entity) {
      showEntityPanel(p.data.entity.id);
    }
  });
  await load();
  const pid = new URLSearchParams(location.search).get("paper");
  if (pid && byId[+pid]) selectNode(+pid);
}
boot();
</script>
